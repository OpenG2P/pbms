# pbms — build & publish on GitLab.
#
# Generated by openg2p/packaging ci/migrate/github-to-gitlab.sh, translated
# from this repo's GitHub caller. All versioning/build/publish logic lives
# centrally in openg2p/packaging@v1; this file only declares what THIS repo has.
#
#   images -> registry.gitlab.com/openg2p/pbms/pbms/<name>   (this project)
#   chart  -> openg2p/charts Helm registry                (shared catalogue)

include:
  - project: 'openg2p/packaging'
    ref: v1
    file: '/ci/gitlab/build-publish.yml'

variables:
  PACKAGING_REF: v1

  IMAGES: |
    [
      {
        "name": "openg2p-pbms-core",
        "dockerfile": "docker/openg2p-pbms-odoo/utils/Dockerfile"
      },
      {
        "name": "openg2p-pbms-staff-portal-api",
        "dockerfile": "docker/openg2p-pbms-apis/staff-portal-api/Dockerfile",
        "pins": [
          {
            "arg": "FASTAPI_COMMON_REF",
            "repo": "https://github.com/openg2p/openg2p-fastapi-common",
            "ref": "develop"
          }
        ]
      },
      {
        "name": "openg2p-pbms-bene-portal-api",
        "dockerfile": "docker/openg2p-pbms-apis/bene-portal-api/Dockerfile",
        "pins": [
          {
            "arg": "FASTAPI_COMMON_REF",
            "repo": "https://github.com/openg2p/openg2p-fastapi-common",
            "ref": "develop"
          }
        ]
      },
      {
        "name": "openg2p-pbms-bg-task-celery-workers",
        "dockerfile": "docker/openg2p-pbms-bg-tasks/bg-task-celery-worker/Dockerfile",
        "pins": [
          {
            "arg": "FASTAPI_COMMON_REF",
            "repo": "https://github.com/openg2p/openg2p-fastapi-common",
            "ref": "develop"
          },
          {
            "arg": "G2P_BRIDGE_REF",
            "repo": "https://gitlab.com/openg2p/g2p-bridge/g2p-bridge",
            "ref": "develop"
          }
        ]
      },
      {
        "name": "openg2p-pbms-bg-task-celery-beat-producers",
        "dockerfile": "docker/openg2p-pbms-bg-tasks/bg-task-celery-beat/Dockerfile",
        "pins": [
          {
            "arg": "FASTAPI_COMMON_REF",
            "repo": "https://github.com/openg2p/openg2p-fastapi-common",
            "ref": "develop"
          }
        ]
      }
    ]

  CHART_PATH: deployment/charts/openg2p-pbms
  CHART_IMAGE_PATHS: '[".odoo.image.tag",".staffPortalApi.image.tag",".benePortalApi.image.tag",".celeryWorkers.image.tag",".beatProducers.image.tag"]'
  CHART_GITLAB_PROJECT: openg2p/charts
