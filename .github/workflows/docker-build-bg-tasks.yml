name: Publish PBMS Background Task Dockers

# Celery worker and beat-producer images, built from LOCAL in-repo source
# (core/ + extensions/). The image tag is the repository ref (branch name or
# git tag) — e.g. a push to `develop` publishes `:develop`.
#
# External OpenG2P libs (openg2p-fastapi-common family, g2p-bridge models) are
# not in this repo; their refs are workflow_dispatch inputs with defaults.
on:
  push:
    branches:
      - "**"
    tags:
      - "**"
    paths:
      - 'core/**'
      - 'extensions/**'
      - 'docker/openg2p-pbms-bg-tasks/**'
      - '.github/workflows/docker-build-bg-tasks.yml'
  workflow_dispatch:
    inputs:
      fastapi_common_ref:
        description: "openg2p-fastapi-common git ref (tag/branch)"
        default: "develop"
        type: string
      g2p_bridge_ref:
        description: "openg2p-g2p-bridge git ref for openg2p-g2p-bridge-models"
        default: "2.0"
        type: string

jobs:
  docker-build:
    runs-on: ubuntu-latest
    name: Docker - ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: bg-task-celery-worker
            image: openg2p/openg2p-pbms-bg-task-celery-workers
            dockerfile: docker/openg2p-pbms-bg-tasks/bg-task-celery-worker/Dockerfile
          - name: bg-task-celery-beat
            image: openg2p/openg2p-pbms-bg-task-celery-beat-producers
            dockerfile: docker/openg2p-pbms-bg-tasks/bg-task-celery-beat/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.docker_hub_actor }}
          password: ${{ secrets.docker_hub_token }}

      - name: Derive image tag from repo ref
        id: meta
        shell: bash
        run: |
          echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build and push - ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64
          build-args: |
            FASTAPI_COMMON_REF=${{ inputs.fastapi_common_ref || 'develop' }}
            G2P_BRIDGE_REF=${{ inputs.g2p_bridge_ref || '2.0' }}
          tags: ${{ matrix.image }}:${{ steps.meta.outputs.tag }}
          labels: |
            org.opencontainers.image.created=${{ steps.meta.outputs.created }}
            org.opencontainers.image.authors=${{ github.repository_owner }}
            org.opencontainers.image.source=${{ github.repository }}@${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.tag }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.vendor=${{ github.repository_owner }}
            org.opencontainers.image.title=${{ matrix.image }}
            org.opencontainers.image.description=OpenG2P PBMS background task image
            org.openg2p.service.name=${{ matrix.name }}
