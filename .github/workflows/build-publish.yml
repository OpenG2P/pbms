# OpenG2P PBMS — build & publish (images + Helm chart + changelog).
#
# Thin caller for the central pipeline in openg2p/openg2p-packaging@v1. All the
# versioning / changelog LOGIC lives there; this file only declares WHAT pbms
# produces (5 images + the openg2p-pbms chart). It replaces the old
# docker-build-*.yml and helm-publish.yml.
#
# Images -> Docker Hub (openg2p/openg2p-pbms-*), chart -> openg2p/openg2p-helm
# gh-pages (Rancher-annotated), changelog -> openg2p/openg2p-packaging gh-pages.

name: Build & Publish

# ---- IDENTICAL BOILERPLATE (keep byte-for-byte the same across repos) --------
on:
  push:
    branches: ["**"]
    tags: ["**"]
  workflow_dispatch:
    inputs:
      changelog_skip_ai:
        description: 'Skip the AI summary — publish the changelog from commit messages only (use when AI is unavailable). Leave OFF for a normal run.'
        type: boolean
        default: false
      changelog_regenerate:
        description: 'Backfill the AI summary for a release that published without one: enter its frozen version e.g. 1.0.1 (not a develop version). Leave EMPTY for a normal run.'
        type: string
        default: ''

jobs:
  build-publish:
    uses: openg2p/openg2p-packaging/.github/workflows/build-publish.yml@v1
    with:
      # --- IDENTICAL BOILERPLATE ---
      changelog_skip_ai: ${{ inputs.changelog_skip_ai || false }}
      changelog_regenerate: ${{ inputs.changelog_regenerate || '' }}
      packaging-ref: v1

      # --- PER-REPO DECLARATIONS ---
      # One entry per image. `pins` resolve a git-ref build-arg to a SHA (recorded
      # as an org.openg2p.pin.* provenance label); add a pin ONLY for an ARG the
      # Dockerfile actually declares (the pipeline refuses a false pin).
      #   FASTAPI_COMMON_REF -> github openg2p-fastapi-common @ develop
      #   G2P_BRIDGE_REF     -> gitlab g2p-bridge/g2p-bridge  @ develop
      #   ODOO_COMMONS_REF   -> github openg2p-odoo-commons    @ v1.4.0
      images: |
        [
          {"name": "openg2p-pbms-core",
           "repo": "openg2p/openg2p-pbms-core",
           "dockerfile": "docker/openg2p-pbms-odoo/utils/Dockerfile",
           "pins": [
             {"arg": "ODOO_COMMONS_REF",
              "repo": "https://github.com/OpenG2P/openg2p-odoo-commons",
              "ref": "v1.4.0"}
           ]},
          {"name": "openg2p-pbms-staff-portal-api",
           "repo": "openg2p/openg2p-pbms-staff-portal-api",
           "dockerfile": "docker/openg2p-pbms-apis/staff-portal-api/Dockerfile",
           "pins": [
             {"arg": "FASTAPI_COMMON_REF",
              "repo": "https://github.com/openg2p/openg2p-fastapi-common",
              "ref": "develop"}
           ]},
          {"name": "openg2p-pbms-bene-portal-api",
           "repo": "openg2p/openg2p-pbms-bene-portal-api",
           "dockerfile": "docker/openg2p-pbms-apis/bene-portal-api/Dockerfile",
           "pins": [
             {"arg": "FASTAPI_COMMON_REF",
              "repo": "https://github.com/openg2p/openg2p-fastapi-common",
              "ref": "develop"}
           ]},
          {"name": "openg2p-pbms-bg-task-celery-workers",
           "repo": "openg2p/openg2p-pbms-bg-task-celery-workers",
           "dockerfile": "docker/openg2p-pbms-bg-tasks/bg-task-celery-worker/Dockerfile",
           "pins": [
             {"arg": "FASTAPI_COMMON_REF",
              "repo": "https://github.com/openg2p/openg2p-fastapi-common",
              "ref": "develop"},
             {"arg": "G2P_BRIDGE_REF",
              "repo": "https://gitlab.com/openg2p/g2p-bridge/g2p-bridge",
              "ref": "develop"}
           ]},
          {"name": "openg2p-pbms-bg-task-celery-beat-producers",
           "repo": "openg2p/openg2p-pbms-bg-task-celery-beat-producers",
           "dockerfile": "docker/openg2p-pbms-bg-tasks/bg-task-celery-beat/Dockerfile",
           "pins": [
             {"arg": "FASTAPI_COMMON_REF",
              "repo": "https://github.com/openg2p/openg2p-fastapi-common",
              "ref": "develop"}
           ]}
        ]
      chart-path: deployment/charts/openg2p-pbms
      chart-image-paths: '[".odoo.image.tag", ".staffPortalApi.image.tag", ".benePortalApi.image.tag", ".celeryWorkers.image.tag", ".beatProducers.image.tag"]'

    # ---- IDENTICAL BOILERPLATE ----
    secrets:
      docker_hub_actor: ${{ secrets.docker_hub_actor }}
      docker_hub_token: ${{ secrets.docker_hub_token }}
      OPENG2P_BOT_GITHUB_PAT: ${{ secrets.OPENG2P_BOT_GITHUB_PAT }}
      # Org-level secret; if unset the changelog still publishes human notes.
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
