questions:
# General Settings
- variable: hostname
  description: Hostname to access PBMS
  type: string
  label: Hostname
  group: General Settings

- variable: global.postgresqlHost
  description: Hostname to access PostgreSQL
  type: string
  label: PostgreSQL Host
  group: General Settings

- variable: global.keycloakBaseUrl
  description: Keycloak Base URL used in all components (e.g. https://keycloak.openg2p.sandbox.net)
  type: string
  label: Keycloak Base URL
  group: General Settings

- variable: global.mailInstallationName
  description: Email Service name
  type: string
  label: Email Service Name
  group: General Settings

# Odoo Settings
- variable: odoo.image.tag
  description: Image tag (version) for the Odoo base image
  type: string
  label: Odoo Image Tag
  group: Odoo Settings
  show_if: "odoo.enabled=true"

- variable: odoo.odooEmail
  description: Odoo admin (login) email address
  type: string
  label: Odoo Admin Email
  group: Odoo Settings
  show_if: "odoo.enabled=true"

- variable: odoo.extraAddonsUrlsToPull
  description: >-
    Comma-separated git URLs of extra Odoo addons to pull at container startup,
    e.g. git://branch//https://github.com/org/repo (optional; leave empty for none).
  type: string
  label: Odoo Extra Addons URLs to Pull
  group: Odoo Settings
  show_if: "odoo.enabled=true"

# Background Task Settings
- variable: beatProducers.envVars.BG_TASK_CELERY_BEAT_PRODUCER_FREQUENCY
  description: Frequency (in seconds) for Celery Beat Producer to run.
  type: int
  label: Celery Beat Producer Frequency
  group: Background Task Settings
  show_if: "beatProducers.enabled=true"

- variable: beatProducers.envVars.BG_TASK_CELERY_BEAT_BATCH_SIZE
  description: Number of tasks to process in each batch by Celery Beat Producer.
  type: int
  label: Celery Beat Producer Batch Size
  group: Background Task Settings
  show_if: "beatProducers.enabled=true"

- variable: beatProducers.envVars.BG_TASK_CELERY_BEAT_NO_OF_TASKS_TO_PROCESS
  description: Number of tasks to process per run by Celery Beat Producer.
  type: int
  label: Celery Beat Producer Number of Tasks to Process
  group: Background Task Settings
  show_if: "beatProducers.enabled=true"

- variable: celeryWorkers.envVars.BG_TASK_CELERY_WORKERS_G2P_BRIDGE_BASE_URL
  description: Base URL for G2P Bridge API used by Celery Workers.
  type: string
  label: Celery Workers G2P Bridge Base URL
  group: Background Task Settings
  show_if: "celeryWorkers.enabled=true"

- variable: celeryWorkers.envVars.BG_TASK_CELERY_WORKERS_BATCH_SIZE
  description: Number of tasks to process in each batch by Celery Workers.
  type: int
  label: Celery Workers Batch Size
  group: Background Task Settings
  show_if: "celeryWorkers.enabled=true"

# Portal API Settings
- variable: staffPortalApi.enabled
  description: Enable Staff Portal API component
  type: boolean
  label: Enable Staff Portal API
  group: Portal API Settings

- variable: benePortalApi.enabled
  description: Enable Bene Portal API component
  type: boolean
  label: Enable Bene Portal API
  group: Portal API Settings

- variable: benePortalApi.envVars.COMMON_AUTH_DEFAULT_ISSUERS
  description: Default list of OIDC issuers for Bene Portal API
  type: string
  label: Bene Portal API Default Issuers
  group: Portal API Settings
  show_if: "benePortalApi.enabled=true"

- variable: benePortalApi.envVars.COMMON_AUTH_DEFAULT_JWKS_URLS
  description: Default list of JWKS URLs for Bene Portal API
  type: string
  label: Bene Portal API Default JWKS URLs
  group: Portal API Settings
  show_if: "benePortalApi.enabled=true"

# Registry settings
- variable: global.registryConnector
  description: How PBMS reads the registry. db queries the registry database. dci calls the registry partner API POST /dci/sync/search.
  type: enum
  options:
    - db
    - dci
  default: db
  label: Registry Connector
  group: Registry

- variable: global.registryDB
  description: Name of the Registry DB in PostgreSQL. Used when the connector is db.
  type: string
  label: Registry DB
  group: Registry
  show_if: "global.registryConnector=db"

- variable: global.registryDBUser
  description: Name of the Registry DB User in PostgreSQL. Used when the connector is db.
  type: string
  label: Registry DB User
  group: Registry
  show_if: "global.registryConnector=db"

- variable: global.registryDBSecret
  description: Name of the Registry DB Secret that contains the user password. Used when the connector is db.
  type: string
  label: Registry DB Secret with User Password
  group: Registry
  show_if: "global.registryConnector=db"

- variable: global.registryDBUserPasswordKey
  description: Key inside the Registry DB Secret that contains the user password. Used when the connector is db.
  type: string
  label: Registry DB Secret Key with User Password
  group: Registry
  show_if: "global.registryConnector=db"

- variable: global.registryPartnerApiUrl
  description: Origin of the registry partner API, with no path. PBMS calls {url}/dci/sync/search. Used when the connector is dci.
  type: string
  default: http://registry-partner-api
  label: Registry Partner API URL
  group: Registry
  show_if: "global.registryConnector=dci"

- variable: global.registryPartnerApiTimeout
  description: Seconds to wait for one registry partner API call. Used when the connector is dci.
  type: int
  default: 30
  label: Registry Partner API Timeout
  group: Registry
  show_if: "global.registryConnector=dci"

- variable: global.registryPartnerApiSslVerify
  description: Verify the registry partner API TLS certificate. Used when the connector is dci.
  type: boolean
  default: true
  label: Registry Partner API TLS Verify
  group: Registry
  show_if: "global.registryConnector=dci"

- variable: global.farmerRegType
  description: DCI search reg_type for farmers. Must match the register mnemonic on the registry.
  type: string
  default: Farmer
  label: Farmer Register Type
  group: Registry
  show_if: "global.registryConnector=dci"

- variable: global.householdRegType
  description: DCI search reg_type for households. Must match the register mnemonic on the registry.
  type: string
  default: Household
  label: Household Register Type
  group: Registry
  show_if: "global.registryConnector=dci"

- variable: global.farmerRegRecordType
  description: DCI reg_record_type sent with a farmer search.
  type: string
  default: Farmer
  label: Farmer Record Type
  group: Registry
  show_if: "global.registryConnector=dci"

- variable: global.householdRegRecordType
  description: DCI reg_record_type sent with a household search.
  type: string
  default: Household
  label: Household Record Type
  group: Registry
  show_if: "global.registryConnector=dci"



# End of main PBMS/values.yaml-driven questions.
